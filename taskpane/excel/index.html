<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defense-in-depth against XSS via tool/agent output. Model text is
       rendered by Streamdown, which sanitizes it (rehype-sanitize, then
       rehype-harden); this catches regressions. script-src allows our own
       origin + the Office.js CDN; connect-src allows the same-origin
       /bridge-token fetch + the WS bridge (127.0.0.1:47833). style-src keeps
       'unsafe-inline' for the inline styles Radix and Motion set. NOTE: if a
       future Office build pulls scripts from another Microsoft origin and the
       panel goes blank, widen script-src/connect-src — do NOT remove the policy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                 script-src 'self' https://appsforoffice.microsoft.com;
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 connect-src 'self' ws://127.0.0.1:47833;
                 base-uri 'none';
                 object-src 'none'"
    />
    <title>Excel 助手</title>
    <script src="/office-js/office.js"></script>
    <link rel="stylesheet" href="/app/dist/pane.css" />
  </head>
  <body>
    <div id="root" class="h-full"></div>
    <script type="module" src="/app/dist/pane.js"></script>
  </body>
</html>
